name: horizontal_weekly_calendar
description: A beautiful, reliable, and fully customizable horizontal calendar UI kit for Flutter, with events, agendas, timelines, and foldable month views.
version: 2.0.0
homepage: https://github.com/AhmedZaeem/horizontal_weekly_calendar
repository: https://github.com/AhmedZaeem/horizontal_weekly_calendar
issue_tracker: https://github.com/AhmedZaeem/horizontal_weekly_calendar/issues
topics:
  - calendar
  - horizontal-calendar
  - schedule
  - events
  - date-picker
screenshots:
  - description: Training week built on the horizontal date strip.
    path: doc/screenshots/01-training-week.png
  - description: Flight fares on the snapping date carousel.
    path: doc/screenshots/02-fare-carousel.png
  - description: Appointment booking on the month grid and availability strip.
    path: doc/screenshots/03-clinic-booking.png
  - description: Single-day timeline with overlapping bookings.
    path: doc/screenshots/05-studio-day.png
  - description: Habit streaks, year heatmap, and derived signals.
    path: doc/screenshots/08-habit-streaks.png
  - description: Home-screen widget families from one payload.
    path: doc/screenshots/12-home-widgets.png
  - description: Widget families on a phone home screen.
    path: doc/screenshots/15-home-screen.png

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
