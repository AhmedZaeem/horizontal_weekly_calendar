name: publish

# Publishing is driven by the tag that release.yml creates, never directly by a
# branch push. pub.dev verifies the tag against the pattern configured on the
# package, so the tag is the thing it trusts.
#
# One-time setup on pub.dev, under the package's Admin tab → Automated
# publishing → Enable publishing from GitHub Actions:
#
#   Repository:    AhmedZaeem/horizontal_weekly_calendar
#   Tag pattern:   v{{version}}
#
# Until that is enabled this workflow will fail at the publish step, which is
# the intended behaviour: nothing can reach pub.dev without the package owner
# having opted in.
#
# These are GitHub filter patterns, not regular expressions: `+` means "one or
# more of the preceding character" and `[]` is a character range. A range may
# not begin with `-`, which is why the prerelease suffix is matched with a
# literal `-` followed by `*` rather than a character class.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v2.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # v2.0.0-beta.1
  # Lets a release be re-published from its existing tag, without having to
  # delete and recreate the tag to fire the push trigger again.
  workflow_dispatch:

jobs:
  publish:
    name: publish to pub.dev
    runs-on: ubuntu-latest
    environment: pub.dev
    # Without a credential pub falls back to an interactive sign-in and waits
    # on stdin, which on a runner means hanging until the six-hour default.
    # stdin is closed below so it fails instead; this is the backstop.
    timeout-minutes: 15
    permissions:
      # Lets pub exchange a short-lived GitHub OIDC token for a pub.dev
      # credential, so no long-lived secret is stored in the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml \
            | head -n1 | tr -d '[:space:]')"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec" \
              "version $declared"
            exit 1
          fi

      - name: package dry run
        run: .github/scripts/publish_dry_run.sh

      # Without a usable credential pub does not merely prompt on stdin: it
      # falls back to the browser OAuth flow, which opens a local callback
      # listener and waits on it forever. Closing stdin cannot interrupt that,
      # so the token is checked up front and the command is bounded.
      - name: check OIDC is available
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No GitHub OIDC token. The job needs" \
              "'permissions: id-token: write'."
            exit 1
          fi
          echo "OIDC token endpoint present."

      - name: publish
        run: |
          set -uo pipefail
          timeout 300 flutter pub publish --force < /dev/null
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "::error title=Publish timed out::pub fell back to interactive" \
              "sign-in, which means pub.dev did not accept the OIDC token." \
              "Check that Automated publishing on pub.dev has the Repository" \
              "field set to ${GITHUB_REPOSITORY} and that the trigger used" \
              "here (${GITHUB_EVENT_NAME}) is enabled there."
            exit 1
          fi
          exit "$status"
